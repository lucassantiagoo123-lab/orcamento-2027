# Sobe a stack inteira (Postgres + backend + frontend) com um comando só —
# não exige instalar Node, Postgres nem nada além do Docker. Ver
# DEPLOY.md para o passo a passo completo.
#
# Segredos abaixo (senha do banco, SESSION_JWT_SECRET) são só para uso local
# — trocar por valores fortes/gerados antes de qualquer deploy real (ver
# seção "Indo para produção de verdade" no DEPLOY.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: obz2027
      POSTGRES_USER: obz
      POSTGRES_PASSWORD: obz_dev_password_troque_em_producao
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed_usuarios.sql:/docker-entrypoint-initdb.d/02-seed_usuarios.sql:ro
      - ./db/seed_referencia.sql:/docker-entrypoint-initdb.d/03-seed_referencia.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obz -d obz2027"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://obz:obz_dev_password_troque_em_producao@db:5432/obz2027
      SESSION_JWT_SECRET: troque-por-um-segredo-forte-gerado-com-openssl-rand
      SESSION_TTL_MINUTES: "30"
      AZURE_TENANT_ID: ""
      AZURE_CLIENT_ID: ""
      AZURE_CLIENT_SECRET: ""
      AZURE_REDIRECT_URI: "http://localhost:8080/auth/callback"
      PORT: "3000"
      FRONTEND_ORIGIN: "http://localhost:8080"
      NODE_ENV: development
      # Login sem senha para testar a interface multiusuário sem o SSO —
      # ver backend/src/auth/routes.js. NUNCA true fora de uso local.
      DEV_LOGIN_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
