# Serve o build do Vite e reencaminha /api e /auth para o backend — assim o
# navegador vê tudo como uma origem só (mesmo host:porta), o que evita
# problemas de CORS/cookie cross-site com o cookie de sessão httpOnly.
#
# O host abaixo é o domínio público do serviço de backend no Railway
# (Settings → Networking → Generate Domain). Hardcoded de propósito — é um
# hostname estático, nginx resolve no início (sem precisar de `resolver`).
# Se recriar o serviço de backend e a URL mudar, atualizar as 3 ocorrências
# abaixo.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass https://generous-bravery-production-5eb8.up.railway.app;
    proxy_ssl_server_name on;
    proxy_set_header Host generous-bravery-production-5eb8.up.railway.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /auth/ {
    proxy_pass https://generous-bravery-production-5eb8.up.railway.app;
    proxy_ssl_server_name on;
    proxy_set_header Host generous-bravery-production-5eb8.up.railway.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /health {
    proxy_pass https://generous-bravery-production-5eb8.up.railway.app/health;
    proxy_ssl_server_name on;
    proxy_set_header Host generous-bravery-production-5eb8.up.railway.app;
  }

  location / {
    try_files $uri /index.html;
  }
}
