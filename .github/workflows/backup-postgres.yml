name: Backup diário Postgres → GitHub Artifacts

on:
  schedule:
    # 06:00 UTC = 03:00 BRT (horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch:   # permite rodar manualmente pelo GitHub a qualquer hora

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Instalar cliente Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Gerar dump comprimido
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          FILENAME="obz2027_$(date +'%Y-%m-%d').sql.gz"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          pg_dump "$DATABASE_URL" | gzip > "$FILENAME"
          echo "Tamanho: $(du -sh $FILENAME | cut -f1)"

      - name: Salvar backup como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obz2027_${{ github.run_id }}
          path: ${{ env.FILENAME }}
          retention-days: 90
